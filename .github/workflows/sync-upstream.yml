name: Sync Fork from Upstream

on:
  schedule:
    # 每天北京时间 14:00 检查上游（UTC 06:00）
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync upstream changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # 添加上游仓库
          git remote add upstream https://github.com/pounat/absorb.git || true
          git fetch upstream
          
          # 检查是否有新的提交
          LOCAL=$(git rev-parse HEAD)
          UPSTREAM=$(git rev-parse upstream/main)
          
          if [ "$LOCAL" != "$UPSTREAM" ]; then
            echo "发现上游更新，正在同步..."
            echo "本地: $LOCAL"
            echo "上游: $UPSTREAM"
            
            # 尝试 rebase
            if git rebase upstream/main; then
              git push origin main
              echo "同步完成"
            else
              echo "同步冲突，中止 rebase"
              git rebase --abort
              echo "CONFLICT" > /tmp/sync_status.txt
              exit 1
            fi
          else
            echo "已是最新版本"
          fi

      - name: Create issue on conflict
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = '⚠️ 上游同步冲突 - 需要手动解决';
            const body = `## 上游同步冲突\n\n自动同步失败，需要手动解决冲突。\n\n请执行以下步骤：\n1. 在本地克隆仓库\n2. 添加上游: \`git remote add upstream https://github.com/pounat/absorb.git\`\n3. 拉取上游: \`git fetch upstream\`\n4. 合并: \`git merge upstream/main\`\n5. 解决冲突后推送\n\n或者使用 \`gh workflow run "Sync Fork from Upstream"\` 重新触发同步。`;
            
            // 检查是否已有相同的 issue
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'sync-conflict',
              per_page: 1
            });
            
            if (issues.data.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['sync-conflict']
              });
            }
