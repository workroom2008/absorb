name: Build Translated Release

on:
  push:
    branches: [main]
    paths:
      - 'lib/l10n/**'
      - 'pubspec.yaml'
  workflow_dispatch:
    inputs:
      prerelease:
        description: "Pre-release?"
        required: false
        type: boolean
        default: false

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Read pubspec version
        id: version
        env:
          PRE: ${{ inputs.prerelease }}
        run: |
          RAW=$(grep '^version:' pubspec.yaml | sed 's/version: *//')
          VERSION_NAME="${RAW%%+*}"
          BUILD="${RAW##*+}"
          BASE="absorb-${RAW//+/-}"
          if [ "$PRE" = "true" ]; then
            echo "tag=v${VERSION_NAME}-zh-${BUILD}" >> "$GITHUB_OUTPUT"
            echo "fname=${BASE}-zh-pre" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v${VERSION_NAME}-zh" >> "$GITHUB_OUTPUT"
            echo "fname=${BASE}-zh" >> "$GITHUB_OUTPUT"
          fi
          echo "raw=$RAW" >> "$GITHUB_OUTPUT"

      - name: Set up Android signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/absorb-upload-key.jks"
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=$RUNNER_TEMP/absorb-upload-key.jks
          EOF

      - name: Build GitHub APKs
        run: bash scripts/build-github-apks

      - name: Rename artifacts
        env:
          FNAME: ${{ steps.version.outputs.fname }}
        run: |
          for apk in build/app/outputs/apk/github/release/*.apk; do
            mv "$apk" "$(dirname "$apk")/${FNAME}.apk"
          done

      - name: Upload APK to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_TAG: ${{ steps.version.outputs.tag }}
          PRE: ${{ inputs.prerelease }}
        run: |
          shopt -s nullglob
          APKS=(build/app/outputs/apk/github/release/*.apk)
          if [ "${#APKS[@]}" -eq 0 ]; then
            echo "No APKs found"
            exit 1
          fi
          if gh release view "$VERSION_TAG" &>/dev/null; then
            gh release upload "$VERSION_TAG" "${APKS[@]}" --clobber
          else
            CREATE_ARGS=(--draft --title "$VERSION_TAG" --notes "中文汉化版本")
            [ "$PRE" = "true" ] && CREATE_ARGS+=(--prerelease)
            gh release create "$VERSION_TAG" "${APKS[@]}" "${CREATE_ARGS[@]}"
          fi

  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: write

    env:
      BUNDLE_ID: com.barnabas.absorb
      APPLE_TEAM_ID: 3W9C9PWP64

    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          LATEST_XCODE=$(ls /Applications/ | grep -E '^Xcode_[0-9]+(\.[0-9]+)?(\.app)?$' | sort -V | tail -1)
          echo "Selecting: $LATEST_XCODE"
          sudo xcode-select -s "/Applications/$LATEST_XCODE/Contents/Developer"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Read pubspec version
        id: version
        env:
          PRE: ${{ inputs.prerelease }}
        run: |
          RAW=$(grep '^version:' pubspec.yaml | sed 's/version: *//')
          VERSION_NAME="${RAW%%+*}"
          BUILD="${RAW##*+}"
          BASE="absorb-${RAW//+/-}"
          if [ "$PRE" = "true" ]; then
            echo "tag=v${VERSION_NAME}-zh-${BUILD}" >> "$GITHUB_OUTPUT"
            echo "fname=${BASE}-zh-pre" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v${VERSION_NAME}-zh" >> "$GITHUB_OUTPUT"
            echo "fname=${BASE}-zh" >> "$GITHUB_OUTPUT"
          fi

      - name: Install codemagic-cli-tools
        run: pipx install codemagic-cli-tools

      - name: Initialise temporary keychain
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: keychain initialize

      - name: Fetch signing files via App Store Connect API
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          CERTIFICATE_PRIVATE_KEY: ${{ secrets.CERTIFICATE_PRIVATE_KEY }}
        run: |
          for BID in "$BUNDLE_ID" "$BUNDLE_ID.NowPlayingWidget"; do
            app-store-connect fetch-signing-files "$BID" \
              --type IOS_APP_STORE \
              --create
          done
          keychain add-certificates

          NEW_DIR="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          OLD_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$NEW_DIR" "$OLD_DIR"
          while IFS= read -r p; do
            [ -z "$p" ] && continue
            cp -v "$p" "$NEW_DIR/" || true
            cp -v "$p" "$OLD_DIR/" || true
          done < <(find "$HOME" "$RUNNER_TEMP" "$GITHUB_WORKSPACE" /tmp -name '*.mobileprovision' 2>/dev/null)

          xcode-project use-profiles --project ios/Runner.xcodeproj

      - name: Build IPA
        run: flutter build ipa --release --export-options-plist=$HOME/export_options.plist

      - name: Rename IPA
        env:
          FNAME: ${{ steps.version.outputs.fname }}
        run: |
          IPA_SRC=$(ls build/ios/ipa/*.ipa | head -1)
          mv "$IPA_SRC" "build/ios/ipa/${FNAME}.ipa"

      - name: Upload IPA to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$VERSION_TAG" &>/dev/null; then
            gh release upload "$VERSION_TAG" build/ios/ipa/*.ipa --clobber
          else
            CREATE_ARGS=(--draft --title "$VERSION_TAG" --notes "中文汉化版本")
            [ "${{ inputs.prerelease }}" = "true" ] && CREATE_ARGS+=(--prerelease)
            gh release create "$VERSION_TAG" build/ios/ipa/*.ipa "${CREATE_ARGS[@]}"
          fi

      - name: Upload to TestFlight
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          IPA_PATH=$(ls build/ios/ipa/*.ipa | head -1)
          app-store-connect publish --path "$IPA_PATH"
