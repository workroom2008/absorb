name: Build Translated Release

on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: "Pre-release?"
        required: false
        type: boolean
        default: false

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache pub
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.PUB_CACHE }}
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Read pubspec version
        id: version
        env:
          PRE: ${{ inputs.prerelease }}
        run: |
          RAW=$(grep '^version:' pubspec.yaml | sed 's/version: *//')
          VERSION_NAME="${RAW%%+*}"
          BUILD="${RAW##*+}"
          BASE="panghu-${RAW//+/-}"
          if [ "$PRE" = "true" ]; then
            echo "tag=v${VERSION_NAME}-zh-${BUILD}" >> "$GITHUB_OUTPUT"
            echo "fname=${BASE}-zh-pre" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v${VERSION_NAME}-zh" >> "$GITHUB_OUTPUT"
            echo "fname=${BASE}-zh" >> "$GITHUB_OUTPUT"
          fi
          echo "raw=$RAW" >> "$GITHUB_OUTPUT"

      - name: Set up Android signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/absorb-upload-key.jks"
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=$RUNNER_TEMP/absorb-upload-key.jks
          EOF

      - name: Build split APKs per ABI
        run: |
          flutter build apk --release --flavor github --split-per-abi --dart-define=GITHUB_BUILD=true

      - name: Rename and organize APKs
        env:
          FNAME: ${{ steps.version.outputs.fname }}
        run: |
          mkdir -p output
          for abi in arm64-v8a armeabi-v7a x86_64; do
            APK=$(ls build/app/outputs/apk/github/release/*-${abi}.apk 2>/dev/null | head -1)
            if [ -n "$APK" ]; then
              cp "$APK" "output/${FNAME}-${abi}.apk"
              echo "✅ ${FNAME}-${abi}.apk"
            fi
          done
          ls -la output/

      - name: Upload APKs to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_TAG: ${{ steps.version.outputs.tag }}
          PRE: ${{ inputs.prerelease }}
        run: |
          shopt -s nullglob
          APKS=(output/*.apk)
          if [ "${#APKS[@]}" -eq 0 ]; then
            echo "No APKs found"
            exit 1
          fi
          echo "Uploading ${#APKS[@]} APKs..."
          if gh release view "$VERSION_TAG" &>/dev/null; then
            gh release upload "$VERSION_TAG" "${APKS[@]}" --clobber
          else
            NOTES="胖虎听书 中文汉化版本\n\n"
            for apk in "${APKS[@]}"; do
              SIZE=$(du -h "$apk" | cut -f1)
              ABI=$(basename "$apk" | sed 's/.*-\(.*\)\.apk/\1/')
              NOTES+="- ${ABI}: ${SIZE}\n"
            done
            CREATE_ARGS=(--draft --title "$VERSION_TAG" --notes "$(echo -e "$NOTES")")
            [ "$PRE" = "true" ] && CREATE_ARGS+=(--prerelease)
            gh release create "$VERSION_TAG" "${APKS[@]}" "${CREATE_ARGS[@]}"
          fi
